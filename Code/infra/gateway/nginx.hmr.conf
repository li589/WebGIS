worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;
    server_tokens off;

    log_format main '$remote_addr - $request [$status] $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    # WebSocket upgrade for Vite HMR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream cgda_fastapi {
        server host.docker.internal:8000;
        keepalive 16;
    }

    upstream cgda_vite {
        server host.docker.internal:5174;
        keepalive 8;
    }

    server {
        listen 5175;
        server_name _;

        include /etc/nginx/snippets/cgda/security-headers.conf;

        location = /maintenance.html {
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 120 always;
        }

        location = /50x.html {
            internal;
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location = /413.html {
            internal;
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # 问题反馈中心（静态；与静态剖面一致）
        location ^~ /feedback/ {
            root /etc/nginx/maintenance/html;
            try_files $uri $uri/ =404;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-store" always;

            location ^~ /feedback/api/ {
                error_page 413 @json413;
                error_page 502 503 504 /50x.html;
                proxy_pass http://cgda_fastapi;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Connection "";
                proxy_connect_timeout 10s;
                proxy_send_timeout 120s;
                proxy_read_timeout 120s;
            }
        }

        location @json413 {
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type application/json;
            return 413 '{"detail":"上传内容超过 200 MB 上限，请压缩数据或使用分块上传"}';
        }

        location ~ ^/(api|workflow-runs|workflow-definitions|workflow-node-templates|workflow-timers|cleanup|layers|weather|artifacts|gee|system|provider|runtime|frontend|config|unified-tiles|overlay-tiles|overlay-preview|overlay-bounds|overlay-value|overlay-asset-workflows|layer-assets|workflows|overlays|import|export|auth|workspace|analysis|agent)(/|$) {
            error_page 413 @json413;
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location ~ ^/(health|docs|redoc|openapi\.json)(/|$) {
            error_page 413 @json413;
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
        }

        # 前端 + Vite HMR / WebSocket → 宿主机 Vite :5174
        # 不做 /assets 静态 try_files，避免挡住 Vite 开发资源。
        location / {
            if (-f /etc/nginx/maintenance/on) {
                return 503;
            }
            error_page 413 /413.html;
            error_page 500 501 502 504 505 /50x.html;
            error_page 503 /maintenance.html;

            proxy_pass http://cgda_vite;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
