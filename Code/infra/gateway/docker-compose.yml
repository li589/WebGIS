# CGDA Nginx Gateway
#
# 演示/对外同域入口：对外 :5175
#   - 静态：Code/frontend/dist
#   - 反代：宿主机 FastAPI 127.0.0.1:8000（容器内 host.docker.internal:8000）
#
# 与日常 Vite 开发：``launch.py start --vite`` = Gateway :5175 + 背后 Vite :5174（HMR）。
# 默认静态 dist；仅 ``start frontend`` 仍直连 Vite 独占端口。
#
# Windows: Docker Desktop 与终端须管理员身份运行。
#
# 启动:
#   Env\Python312\python.exe launch.py start gateway
#   Env\Python312\python.exe launch.py start --vite
#   Env\Python312\python.exe launch.py reload gateway
# 停止:
#   Env\Python312\python.exe launch.py stop gateway
#   或随 launch.py stop 一并停止

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cgda-gateway-nginx
    restart: unless-stopped
    ports:
      - "5175:5175"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./snippets:/etc/nginx/snippets/cgda:ro
      - ./maintenance:/etc/nginx/maintenance:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5175/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
