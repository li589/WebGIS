# CGDA Nginx Gateway
#
# 演示/对外同域入口：对外 :5175
#   - 静态：Code/frontend/dist
#   - 反代：宿主机 FastAPI 127.0.0.1:8000（容器内 host.docker.internal:8000）
#
# 与日常 Vite 开发互斥（同端口 5175）。默认 launch.py start 不起 Gateway。
#
# Windows: Docker Desktop 与终端须管理员身份运行。
#
# 启动:
#   Env\Python312\python.exe launch.py start gateway
# 停止:
#   Env\Python312\python.exe launch.py stop gateway
#   或随 launch.py stop 一并停止

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cgda-gateway-nginx
    restart: unless-stopped
    ports:
      - "5175:5175"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/etc/nginx/error-pages:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5175/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
