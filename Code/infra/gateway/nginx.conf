worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;
    server_tokens off;

    log_format main '$remote_addr - $request [$status] $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    upstream cgda_fastapi {
        server host.docker.internal:8000;
        keepalive 16;
    }

    server {
        listen 5175;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 独立维护/错误页：纯 HTML，不依赖 Vue / 不暴露源码或堆栈。
        # 页面与开关同树：Code/infra/gateway/maintenance/{html,on}
        # 启用维护：创建 maintenance/on（空文件），再 reload nginx。
        # API 反代不受影响，升级期间后台任务可继续。
        location = /maintenance.html {
            root /etc/nginx/maintenance/html;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 120 always;
        }

        location = /50x.html {
            internal;
            root /etc/nginx/maintenance/html;
        }

        location ~ ^/(workflow-runs|workflow-definitions|workflow-node-templates|workflow-timers|cleanup|layers|weather|artifacts|gee|system|provider|runtime|frontend|config|unified-tiles|overlay-tiles|overlay-preview|overlay-bounds|overlay-value|overlays|import|export|auth|analysis)(/|$) {
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location ~ ^/(health|docs|redoc|openapi\.json)(/|$) {
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
        }

        location / {
            # 仅拦截前台 SPA / 静态资源；API location 优先匹配，不受此 if 影响。
            if (-f /etc/nginx/maintenance/on) {
                return 503;
            }
            error_page 503 /maintenance.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
