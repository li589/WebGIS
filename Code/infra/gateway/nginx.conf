# CGDA Nginx Gateway — 同域入口 :5175
# 路径策略与 Code/frontend/vite.config.ts proxy 对齐（无 /api 前缀）

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;

    log_format main '$remote_addr - $request [$status] $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    # 宿主机 FastAPI（Docker Desktop: host.docker.internal）
    upstream cgda_fastapi {
        server host.docker.internal:8000;
        keepalive 16;
    }

    server {
        listen 5175;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # —— API / 瓦片 / 导入导出（与 vite.config.ts server.proxy 对齐）——
        location ~ ^/(workflow-runs|workflow-definitions|workflow-node-templates|workflow-timers|cleanup|layers|weather|artifacts|gee|system|provider|runtime|frontend|config|unified-tiles|overlay-preview|overlay-bounds|overlay-value|overlays|import|export)(/|$) {
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # 可选：经同域入口访问 API 文档 / 健康检查
        location ~ ^/(health|docs|redoc|openapi\.json)(/|$) {
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # SPA 静态资源（缺 dist 时 Nginx 会 403；请先 npm run build）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
