worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;
    server_tokens off;

    log_format main '$remote_addr - $request [$status] $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    upstream cgda_fastapi {
        server host.docker.internal:8000;
        keepalive 16;
    }

    server {
        listen 5175;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 安全响应头统一片段（安全审计 2026-08-20）：location 内出现任一
        # add_header 即不再继承 server 级安全头（nginx 继承规则），因此
        # 凡含 add_header 的 location 必须重新 include 本片段。
        include /etc/nginx/snippets/cgda/security-headers.conf;

        # 独立维护/错误页：纯 HTML，不依赖 Vue / 不暴露源码或堆栈。
        # 页面与开关同树：Code/infra/gateway/maintenance/{html,on}
        # 启用维护：创建 maintenance/on（空文件），再 reload nginx。
        # API 反代不受影响，升级期间后台任务可继续。
        location = /maintenance.html {
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 120 always;
        }

        location = /50x.html {
            internal;
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location = /413.html {
            internal;
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # Vite hashed assets：禁止 SPA 回退。旧 hash 缺失必须真 404，
        # 否则浏览器拿到 index.html 当 JS → Failed to fetch dynamically imported module。
        # 文件名含 content hash，可长期 immutable 缓存。
        location ^~ /assets/ {
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # 入口 HTML 禁止缓存，保证 rebuild 后浏览器总能拿到新 chunk 引用。
        location = /index.html {
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location = / {
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }

        # 问题反馈中心（非 Vue 独立静态页）：后端宕机 / 维护期仍可访问与提交。
        # 数据面双轨：
        #   - 在线轨：/feedback/api/* 反代 FastAPI（上传落盘 + 工程师在线查看）
        #   - 离线轨：表单存浏览器本地（IndexedDB）→ 复制 Markdown / 导出 JSON
        # 维护开关（maintenance/on）仅作用于 location / 的 SPA 拦截，不影响本入口。
        # 注意：静态子树不 include security-headers 片段，而是单独下发更严格的
        # CSP——反馈页 JS/CSS 均外置、无内联脚本，可去掉 unsafe-inline 与外链字体/瓦片白名单。
        location ^~ /feedback/ {
            root /etc/nginx/maintenance/html;
            try_files $uri $uri/ =404;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-store" always;

            # API 子路径反代后端（嵌套 ^~ 优先于外层静态规则；后端不可用时
            # 前端自动降级离线轨，502/504 由 50x.html 呈现）。
            # 语义：POST 上传（multipart ≤ client_max_body_size）、admin 读写、
            # token 进展查询；上传由后端专属限流（默认 5 次/分钟/IP）。
            location ^~ /feedback/api/ {
                error_page 413 @json413;
                error_page 502 503 504 /50x.html;
                proxy_pass http://cgda_fastapi;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Connection "";
                proxy_connect_timeout 10s;
                proxy_send_timeout 120s;
                proxy_read_timeout 120s;
            }
        }

        # API 上传体超限（> client_max_body_size）时返回 JSON 413：
        # 上传几乎全部走 API XHR，保持与后端一致的 {detail} 错误契约
        # 供前端 _http.ts 解析；浏览器表单直发场景由 location / 的
        # error_page 413 /413.html 兜底为品牌化 HTML 页。
        location @json413 {
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type application/json;
            return 413 '{"detail":"上传内容超过 200 MB 上限，请压缩数据或使用分块上传"}';
        }

        # 图层平台 P0/P1 新增前缀（2026-08-25 405 修复）：overlay-asset-workflows
        # （资产工作流 POST）、layer-assets（在线源同步 POST）、workflows
        # （课题组模板 GET/POST）。缺代理时 POST 落到 SPA 静态 location → 405。
        location ~ ^/(api|workflow-runs|workflow-definitions|workflow-node-templates|workflow-timers|cleanup|layers|weather|artifacts|gee|system|provider|runtime|frontend|config|unified-tiles|overlay-tiles|overlay-preview|overlay-bounds|overlay-value|overlay-asset-workflows|layer-assets|workflows|overlays|import|export|auth|workspace|analysis|agent)(/|$) {
            # 不开 proxy_intercept_errors（安全审计决策）：应用层错误 JSON
            # （request_id / error_code / Retry-After）原样透传，由前端
            # _http.ts 统一解析；error_page 仅接管 nginx 自生错误与 413。
            # 注意 error_page 不跨级继承：本 location 出现任一 error_page
            # 即不再继承 server 级定义，须声明完整集合。
            error_page 413 @json413;
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location ~ ^/(health|docs|redoc|openapi\.json)(/|$) {
            # 同上：透传（后端宕机时 nginx 自生 502/504 → 50x.html）。
            error_page 413 @json413;
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
        }

        location / {
            # 仅拦截前台 SPA / 静态资源；API location 优先匹配，不受此 if 影响。
            if (-f /etc/nginx/maintenance/on) {
                return 503;
            }
            # 维护态 503 → 维护页；其余 5xx / 413 → 品牌化错误页（浏览器
            # 导航场景；SPA 深链接刷新由 try_files 兜底 200 不触发 error_page）。
            error_page 413 /413.html;
            error_page 500 501 502 504 505 /50x.html;
            error_page 503 /maintenance.html;
            # 非 assets 的缺失路径回退 index.html（深链接）；index 经内部跳转
            # 命中 location = /index.html 的 no-store。
            try_files $uri $uri/ /index.html;
        }
    }
}
