worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 200m;
    server_tokens off;

    log_format main '$remote_addr - $request [$status] $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    upstream cgda_fastapi {
        server host.docker.internal:8000;
        keepalive 16;
    }

    server {
        listen 5175;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 安全响应头统一片段（安全审计 2026-08-20）：location 内出现任一
        # add_header 即不再继承 server 级安全头（nginx 继承规则），因此
        # 凡含 add_header 的 location 必须重新 include 本片段。
        include /etc/nginx/snippets/cgda/security-headers.conf;

        # 独立维护/错误页：纯 HTML，不依赖 Vue / 不暴露源码或堆栈。
        # 页面与开关同树：Code/infra/gateway/maintenance/{html,on}
        # 启用维护：创建 maintenance/on（空文件），再 reload nginx。
        # API 反代不受影响，升级期间后台任务可继续。
        location = /maintenance.html {
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header Retry-After 120 always;
        }

        location = /50x.html {
            internal;
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location = /413.html {
            internal;
            root /etc/nginx/maintenance/html;
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # API 上传体超限（> client_max_body_size）时返回 JSON 413：
        # 上传几乎全部走 API XHR，保持与后端一致的 {detail} 错误契约
        # 供前端 _http.ts 解析；浏览器表单直发场景由 location / 的
        # error_page 413 /413.html 兜底为品牌化 HTML 页。
        location @json413 {
            include /etc/nginx/snippets/cgda/security-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type application/json;
            return 413 '{"detail":"上传内容超过 200 MB 上限，请压缩数据或使用分块上传"}';
        }

        location ~ ^/(api|workflow-runs|workflow-definitions|workflow-node-templates|workflow-timers|cleanup|layers|weather|artifacts|gee|system|provider|runtime|frontend|config|unified-tiles|overlay-tiles|overlay-preview|overlay-bounds|overlay-value|overlays|import|export|auth|workspace|analysis)(/|$) {
            # 不开 proxy_intercept_errors（安全审计决策）：应用层错误 JSON
            # （request_id / error_code / Retry-After）原样透传，由前端
            # _http.ts 统一解析；error_page 仅接管 nginx 自生错误与 413。
            # 注意 error_page 不跨级继承：本 location 出现任一 error_page
            # 即不再继承 server 级定义，须声明完整集合。
            error_page 413 @json413;
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location ~ ^/(health|docs|redoc|openapi\.json)(/|$) {
            # 同上：透传（后端宕机时 nginx 自生 502/504 → 50x.html）。
            error_page 413 @json413;
            error_page 502 503 504 /50x.html;
            proxy_pass http://cgda_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Connection "";
        }

        location / {
            # 仅拦截前台 SPA / 静态资源；API location 优先匹配，不受此 if 影响。
            if (-f /etc/nginx/maintenance/on) {
                return 503;
            }
            # 维护态 503 → 维护页；其余 5xx / 413 → 品牌化错误页（浏览器
            # 导航场景；SPA 深链接刷新由 try_files 兜底 200 不触发 error_page）。
            error_page 413 /413.html;
            error_page 500 501 502 504 505 /50x.html;
            error_page 503 /maintenance.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
