# 安全响应头统一片段：任何含有 add_header 的 location 必须 include 本片段。
#
# 原因：nginx 继承规则——location 级出现任一 add_header 指令，server 级
# add_header 全部失效（安全审计 2026-08-20 修复项：maintenance/50x/413 页
# 此前丢失 CSP/nosniff/Referrer-Policy）。统一片段避免多处重复 400+ 字符
# CSP 串的漂移风险。
#
# script-src 'unsafe-inline'：index.html 首屏主题引导脚本为内联（后续外置化收紧）。
# script-src 'wasm-unsafe-eval'：允许 WebAssembly.compile/instantiate（Cesium Workers/ThirdParty）。
# script-src 'unsafe-eval'：Cesium Viewer 初始化仍会 Evaluating a string as JavaScript
#   （new Function/eval）；仅 wasm-unsafe-eval 不够——5176 Vite 无 CSP 故正常，5175 会拦。
# style-src 'unsafe-inline'：Vue/Element Plus 运行时内联样式；Google Fonts 为线上字体。
# img-src https:：MapLibre 支持用户自配外部 XYZ/WMS 瓦片源；worker-src blob:：MapLibre / Cesium worker。
# connect-src blob:：MapLibre image source 对 canvas 条带 blob: URL 走 fetch 加载
#（2026-08-24：条带化 data: URL 曾被 connect-src 'self' 拦截致图层一闪而过）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
