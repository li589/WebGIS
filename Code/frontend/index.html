<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="星地融合土壤水分监测与干旱预警数据分析与可视化系统（SGFS）— Satellite-Ground Fusion Soil Data Platform"
    />
    <!-- 系统已内置浅色/深色主题；禁止 Dark Reader 等扩展二次改色（避免浅色发褐） -->
    <meta name="darkreader-lock" />
    <!-- 旧品牌「综合地理态势分析系统（CGDA/CGDAS）」沿革见 src/ui-copy/brand.ts -->
    <title>星地融合土壤水分监测与干旱预警数据分析与可视化系统</title>
    <!-- 字体（2026-10-21 换用思源黑体 + Inter）：
         Inter 负责英文/数字/日期，Noto Sans SC（思源黑体的 Google 发行名）
         负责中文；两者同一 font-family 栈里按字形自动分工。
         display=swap 避免 FOIT；若 CDN 不可达则回落到系统字体（见 tokens.css）。
         回退方式：Tools\restore-fonts.bat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- 首屏同步主题，避免刷新时先暗后浅 / 半透明叠错底发棕 -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('cgda-theme') || 'system'
          var mode =
            pref === 'light' || pref === 'dark'
              ? pref
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', mode)
          var motion = localStorage.getItem('cgda-reduce-motion')
          var reduce =
            motion === 'true' ||
            (motion === null && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.toggle('reduce-motion', reduce)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
