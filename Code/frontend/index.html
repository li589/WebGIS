<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="综合地理态势分析系统（CGDA）— 多源地理与气象数据科研分析平台" />
    <title>综合地理态势分析系统</title>
    <!-- 首屏同步主题，避免刷新时先暗后浅 / 半透明叠错底发棕 -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('cgda-theme') || 'system'
          var mode =
            pref === 'light' || pref === 'dark'
              ? pref
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', mode)
          var motion = localStorage.getItem('cgda-reduce-motion')
          var reduce =
            motion === 'true' ||
            (motion === null && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.toggle('reduce-motion', reduce)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
