# ──────────────────────────────────────────────────────────────────────────────
# Minimum CI workflow
# 触发条件：push 至 dev / main，或 PR 目标为 dev / main
# 质量门：pre-commit (全量) + pytest + vitest + check:openapi
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── pre-commit：lint / 格式化 / 通用钩子 ──────────────────────────────────
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Code/frontend/package-lock.json

      - name: Install frontend deps (for eslint / prettier hooks)
        working-directory: Code/frontend
        run: npm ci --prefer-offline

      - name: Run pre-commit (all files)
        uses: pre-commit/action@v3.0.1

  # ── pytest：后端单元 / 集成测试 ───────────────────────────────────────────
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    needs: pre-commit
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Code/backend/requirements.txt
            Code/backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: Code/backend
        run: |
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov

      # 算法包依赖：Test/algorithms 与后端算法链测试均依赖（numba/xarray 等）
      - name: Install algorithms deps
        working-directory: Code/algorithms/providers/Python
        run: pip install -r requirements.txt

      # P1-13：archive 导入测试依赖 unrar 二进制（Windows 本地为 gitignore 的 vendor 二进制；CI 用 apt 安装）
      - name: Install unrar (for archive import tests)
        run: sudo apt-get update && sudo apt-get install -y unrar

      # SpatiaLite：overlay 视口相交查询测试依赖 mod_spatialite（Windows 本地用 gaia-gis 预编译包；CI 用 apt）
      - name: Install mod_spatialite (for spatial overlay tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite
      # 验证扩展确实可加载：刚装完若不可用，直接让 CI 失败（而非让 7 个空间测试静默 skip）
      - name: Verify SpatiaLite extension loads (fail CI if broken)
        run: python Tools/verify_spatialite.py

      # P1-8：生成 omega_avg_daily 端到端测试所需合成数据（Tools/test_data/ 不入库，CI 现生成），
      # 使 AGENTS.md 点名的核心算法链在 CI 有回归而非永久 skip
      - name: Generate synthetic data for omega_avg_daily e2e test
        run: python -c "import sys; sys.path.insert(0,'Tools'); from generate_synthetic_test_data import generate_omega_avg_daily_inputs as g; g()"

      # P0-3：覆盖率阈值从 50% 提升至 52%（分阶段提升：52% → 55% → 60% → 70%）
      # 当前后端覆盖率约 54%（CI Ubuntu 环境），先设 52 作为不倒退基线
      - name: Run pytest
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: pytest Test/backend/ --tb=short -q --cov=Code/backend/app --cov-report=term --cov-fail-under=52

  # ── vitest：前端单元测试 ──────────────────────────────────────────────────
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Code/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: Code/frontend
        run: npm ci --prefer-offline

      # P0-4：前端覆盖率门禁（起步阈值 = 当前覆盖率基线 lines:22/statements:21/branches:16/functions:19，后续逐步提升至 40%+）
      - name: Run vitest with coverage
        working-directory: Code/frontend
        run: npm run test:coverage

  # ── pytest-algorithms：算法包测试（P1-7 补入 CI；独立 job 避免与 backend conftest 交互）──
  pytest-algorithms:
    name: pytest (algorithms)
    runs-on: ubuntu-latest
    needs: pre-commit
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Code/backend/requirements.txt
            Code/backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: Code/backend
        run: |
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov

      # 算法包依赖：Test/algorithms 与后端算法链测试均依赖（numba/xarray 等）
      - name: Install algorithms deps
        working-directory: Code/algorithms/providers/Python
        run: pip install -r requirements.txt

      - name: Run pytest (algorithms)
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: pytest Test/algorithms/ --tb=short -q

  # ── build：前端生产构建 + 类型检查（P1-7 补生产构建门）──────────────────────
  build:
    name: build (frontend)
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Code/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: Code/frontend
        run: npm ci --prefer-offline

      - name: Build (vue-tsc + vite)
        working-directory: Code/frontend
        run: npm run build

  # ── security-scan：依赖漏洞扫描（独立质量门禁，pip-audit/npm audit 失败即 job 失败；
  #    是否阻塞合并由 GitHub 分支保护 required check 配置决定）───────────────
  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        working-directory: Code/backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit (frontend)
        working-directory: Code/frontend
        run: npm audit --audit-level=high

  # ── check:openapi：前后端契约漂移检测 ──────────────────────────────────────
  check-openapi:
    name: check:openapi
    runs-on: ubuntu-latest
    needs: pre-commit
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Code/backend/requirements.txt
            Code/backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: Code/backend
        run: pip install -r requirements.txt

      # 算法包依赖：openapi 生成会 import 算法 router 链
      - name: Install algorithms deps
        working-directory: Code/algorithms/providers/Python
        run: pip install -r requirements.txt

      - name: Run check:openapi
        working-directory: Code/frontend
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: npm run check:openapi

  # ── check:catalog：FE LAYER_LIBRARY ⊆ BE catalog seeds ─────────────────────
  check-catalog:
    name: check:catalog
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check:catalog
        working-directory: Code/frontend
        run: npm run check:catalog

  # ── gen-types：前端契约类型与 openapi.json 同步闸门（F14）──────────────────
  # 闭合「openapi.json → api-contracts.ts」这第二跳：check:openapi 只守第一跳
  # （活应用 ↔ openapi.json），若有人跑了 export_openapi.py 却忘 gen:types，
  # 提交的前端类型会静默陈旧。本 job 依赖 check-openapi（确保 openapi.json 与活
  # 应用一致），再就地重生成 api-contracts.ts，用 git diff 卡住任何陈旧差异。
  gen-types:
    name: gen:types (contract sync gate)
    runs-on: ubuntu-latest
    needs: check-openapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Code/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: Code/frontend
        run: npm ci --prefer-offline

      - name: Regenerate api-contracts.ts and verify in sync
        working-directory: Code/frontend
        run: |
          npm run gen:types
          if ! git diff --exit-code -- src/types/api-contracts.ts; then
            echo "::error::api-contracts.ts is stale vs openapi.json — run 'npm run gen:types' and commit it"
            exit 1
          fi
